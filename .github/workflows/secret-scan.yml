# ===========================================================================
# Secret scanning
#
# Two jobs, because they catch different mistakes:
#
#   gitleaks         - a secret *inside* a file, anywhere in the history
#   credential-files - a credential-shaped file *tracked at all* (.env, *.key,
#                      *.pem, *.db), whether or not its contents look secret
#
# The second job exists because .gitignore only stops `git add -A`. A file added
# before the rule existed, or force-added past it, is tracked, and rules do not
# apply to tracked files.
#
# Nothing here needs a secret of its own, and nothing here is allowed to write to
# the repository: the workflow runs with `contents: read` and checks out without
# persisting credentials.
# ===========================================================================
name: Secret scan

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a rule added by gitleaks later still sweeps the existing history.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Least privilege: read the code, nothing else. gitleaks needs no write access
# and must not have it — a scanner that can push is a scanner worth attacking.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole history, not the tip. A key that was committed and then
          # deleted is still a published key: it lives in every clone and fork.
          fetch-depth: 0
          # Nothing in this workflow pushes, so the token stays out of the
          # checkout's git config.
          persist-credentials: false

      - name: Scan for secrets
        # Pinned to the major tag for readability. For a supply-chain-hardened
        # repository, pin the commit SHA instead:
        #   gh api repos/gitleaks/gitleaks-action/git/ref/tags/v2 --jq '.object.sha'
        uses: gitleaks/gitleaks-action@v2
        env:
          # Lets the action resolve the commits of a pull request.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for organisation-owned repositories only. A personally owned
          # repository runs without it, and an unset secret expands to an empty
          # string, which the action treats as "no licence". If this repository
          # ever moves under an organisation, add the secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Annotating the diff needs `pull-requests: write`, which this workflow
          # deliberately does not grant. The report is in the job log and the job
          # fails either way; to enable comments, add that permission above and
          # set this to `true`.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          # Keep the SARIF-free summary in the job output — it is the fastest way
          # to see what matched without downloading anything.
          GITLEAKS_ENABLE_SUMMARY: 'true'

  credential-files:
    name: no credential files tracked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail if a credential-shaped file is tracked
        shell: bash
        run: |
          set -euo pipefail

          # `git ls-files` lists tracked files only, which is exactly the set that
          # .gitignore cannot protect (.gitignore is a rule for *untracked*
          # files; `git add -f` and files added before a rule existed ignore it).
          tracked="$(git ls-files)"

          if [ -z "$tracked" ]; then
            echo "No tracked files yet — nothing to check."
            exit 0
          fi

          hits="$(printf '%s\n' "$tracked" \
            | grep -Ev '(^|/)\.env\.example$' \
            | grep -E '(^|/)\.env$|(^|/)\.env\.[^/]+$|(^|/)id_(rsa|ed25519)$|\.(key|pem|p12|pfx|jks|keystore|ppk|db|db-wal|db-shm|db-journal|sqlite|sqlite3|age)$' \
            || true)"

          if [ -n "$hits" ]; then
            {
              echo "::error title=Credential file tracked::A file that must never be committed is in this repository."
              echo ""
              echo "Tracked files matching a credential pattern:"
              printf '%s\n' "$hits" | sed 's/^/  /'
              echo ""
              echo "Fix: git rm --cached <file>, keep it in .gitignore, and if it ever held a real value, rotate that value now — it is in the history and in every fork."
            } >&2
            exit 1
          fi

          echo "OK: no credential-shaped files are tracked."

name: mac-probe

# Dev-only: installs the published Apple Silicon build on a real Mac runner, opens it the way the Dock does
# (launchd's environment), and records what "Sign in" does. Results are pushed to the `probe-results` branch.
on:
  push:
    branches: [mac-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the three CLIs (npm, outside launchd's PATH - like a real Mac)
        run: |
          npm i -g @anthropic-ai/claude-code @openai/codex @google/gemini-cli
          which claude codex gemini node
      - name: Install SDC like a user
        run: |
          tag=$(cat .github/probe/TAG)
          curl -sSL -o sdc.dmg "https://github.com/${{ github.repository }}/releases/download/$tag/SDC_${tag#v}_aarch64.dmg"
          hdiutil attach sdc.dmg -nobrowse -mountpoint /Volumes/SDC
          cp -R /Volumes/SDC/SDC.app /Applications/
          hdiutil detach /Volumes/SDC
          codesign -dv /Applications/SDC.app 2>&1 | head -5
          codesign -dv /Applications/SDC.app/Contents/MacOS/sdcd 2>&1 | head -5
          ls -la /Applications/SDC.app/Contents/MacOS
      - name: Open it from launchd and probe
        run: |
          mkdir -p out
          open -a /Applications/SDC.app
          for i in $(seq 1 60); do lsof -nP -iTCP:7811 -sTCP:LISTEN && break; sleep 1; done
          sleep 5
          pgrep -lf sdc || true
          pid=$(pgrep -x sdcd || true)
          echo "sdcd pid: $pid" | tee out/env.txt
          ps eww $pid | tr ' ' '\n' | grep -E '^(PATH|SHELL|HOME)=' | tee -a out/env.txt || true
          node .github/probe/probe.mjs 2>&1 | tee out/probe.txt
          screencapture -x out/screen.png || true
          ls -la "$HOME/Library/Application Support/sdc" > out/data.txt 2>&1 || true
          log show --last 5m --predicate 'process == "sdcd" OR process == "SDC" OR process == "sdc"' --style compact 2>/dev/null | tail -200 > out/syslog.txt || true
          ls ~/Library/Logs/DiagnosticReports > out/crashes.txt 2>&1 || true
      - name: Push the results
        if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-results
          git rm -rq --cached . || true
          git add -f out
          git commit -qm "mac probe $(date -u +%FT%TZ)"
          git push -qf origin probe-results

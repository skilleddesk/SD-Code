name: mac-probe

# Dev-only. Round 3: (A) the daemon started with launchd's bare environment, CLIs only on ~/.zshrc's PATH;
# (B) the real window driven through accessibility: onboarding -> Provider Hub -> Claude -> Sign in.
on:
  push:
    branches: [mac-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CLIs in ~/.npm-global, reachable only through ~/.zshrc
        run: |
          nodebin=$(dirname "$(which node)")
          npm config set prefix "$HOME/.npm-global"
          npm i -g @anthropic-ai/claude-code @openai/codex >/dev/null
          echo "export PATH=\"$nodebin:\$HOME/.npm-global/bin:\$PATH\"" >> ~/.zshrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - name: Build SDC from this branch's source (the fix under test) and install it
        working-directory: sdc
        run: |
          pnpm install --frozen-lockfile
          cd app && pnpm tauri build --bundles app
          cp -R src-tauri/target/release/bundle/macos/SDC.app /Applications/
          /Applications/SDC.app/Contents/MacOS/sdcd --version || true
      - name: (A) the daemon with launchd's bare environment
        run: |
          mkdir -p out
          env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" SHELL=/bin/zsh TMPDIR="$TMPDIR" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            /Applications/SDC.app/Contents/MacOS/sdcd --port 7811 > out/bare-daemon.log 2>&1 &
          for i in $(seq 1 30); do lsof -nP -iTCP:7811 -sTCP:LISTEN >/dev/null && break; sleep 1; done
          node .github/probe/probe.mjs 2>&1 | tee out/bare.txt
          pkill -x sdcd || true
          sleep 2
      - name: (B) the window, driven like a person
        run: |
          shot() { screencapture -x "out/$1.png" || true; }
          press() { echo "--- press $1"; osascript -l JavaScript .github/probe/ax.js "$1" "$2" 2>&1; }
          open -a /Applications/SDC.app
          for i in $(seq 1 60); do lsof -nP -iTCP:7811 -sTCP:LISTEN >/dev/null && break; sleep 1; done
          sleep 6
          osascript -e 'tell application "SDC" to activate' || true
          sleep 1
          {
            shot 1-start
            press "Work on a project here"; sleep 1
            press "Next" exact; sleep 2; shot 2-model
            press "Open the Provider Hub"; sleep 3; shot 3-hub
            press "Claude Code"; sleep 3; shot 4-connect
            press "Sign in" exact; sleep 4; shot 5-after-4s
            sleep 12; shot 6-after-16s
            echo "--- window text"; osascript -l JavaScript .github/probe/texts.js 2>&1
            echo "--- daemon"; node -e "
              const net=require('net');const s=net.connect(7811,'127.0.0.1');let b='';
              s.on('connect',()=>s.write(JSON.stringify({v:'0.1',id:'x',method:'host.status',params:{}})+'\n'));
              s.on('data',d=>{b+=d;for(const l of b.split('\n')){try{const m=JSON.parse(l);if(m.id==='x'){console.log('pty processes:',m.result.pty);s.end();}}catch{}}});"
            pgrep -lf "claude" || echo "no claude process"
          } 2>&1 | tee out/ui.txt
      - name: Push the results
        if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-results
          git rm -rq --cached . || true
          git add -f out
          git commit -qm "mac probe 3 $(date -u +%FT%TZ)"
          git push -qf origin probe-results

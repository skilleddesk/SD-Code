name: os-probe

# Dev-only: the same end-to-end pass on Windows, macOS (Apple Silicon) and Linux, built from this branch.
# Each OS pushes its results to its own branch, probe-results-<os>.
on:
  push:
    branches: [mac-probe]

permissions:
  contents: write

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            sdc/sdcd
            sdc/app/src-tauri

      - name: CLIs (unix - only on the login shell's PATH, like a real install)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          nodebin=$(dirname "$(which node)")
          npm config set prefix "$HOME/.npm-global"
          npm i -g @anthropic-ai/claude-code @openai/codex >/dev/null
          for rc in ~/.zshrc ~/.bashrc ~/.profile; do echo "export PATH=\"$nodebin:\$HOME/.npm-global/bin:\$PATH\"" >> $rc; done
      - name: CLIs (windows)
        if: runner.os == 'Windows'
        run: npm i -g @anthropic-ai/claude-code @openai/codex

      - name: Build the daemon
        shell: bash
        working-directory: sdc/sdcd
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then cargo build --release; else cargo build --release --features keychain; fi

      - name: An SSH server with a password user (macOS)
        if: runner.os == 'macOS'
        run: |
          pass="E2e-$(openssl rand -hex 8)"; echo "::add-mask::$pass"; echo "E2E_PASS=$pass" >> "$GITHUB_ENV"
          sudo sysadminctl -addUser sdce2e -password "$pass" -home /Users/sdce2e
          sudo createhomedir -c -u sdce2e >/dev/null
          sudo systemsetup -f -setremotelogin on || sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist || true
          sudo dseditgroup -o create -q com.apple.access_ssh 2>/dev/null || true
          sudo dseditgroup -o edit -a sdce2e -t user com.apple.access_ssh || true
          sleep 3; nc -z 127.0.0.1 22 && echo "sshd up"
          mkdir -p out
          cat > /tmp/login.exp <<'EXP'
          set timeout 20
          spawn ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=keyboard-interactive,password sdce2e@127.0.0.1 echo manual-login-ok
          expect {
            -re "(?i)password" { send "$env(E2E_PASS)"; exp_continue }
            "manual-login-ok" { exit 0 }
            timeout { exit 2 }
            eof { exit 3 }
          }
          EXP
          E2E_PASS="$pass" expect /tmp/login.exp > out/manual-login.txt 2>&1; echo "manual login exit $?" | tee -a out/manual-login.txt
      - name: An SSH server with a password user (Linux)
        if: runner.os == 'Linux'
        run: |
          pass="E2e-$(openssl rand -hex 8)"; echo "::add-mask::$pass"; echo "E2E_PASS=$pass" >> "$GITHUB_ENV"
          sudo apt-get install -y openssh-server >/dev/null
          sudo useradd -m -s /bin/bash sdce2e; echo "sdce2e:$pass" | sudo chpasswd
          printf 'PasswordAuthentication yes\nKbdInteractiveAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/99-e2e.conf
          sudo systemctl restart ssh; sleep 2; nc -z 127.0.0.1 22 && echo "sshd up"

      - name: End to end (unix - daemon started with a bare environment)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p out
          env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" SHELL="$(if [ "${{ runner.os }}" = macOS ]; then echo /bin/zsh; else echo /bin/bash; fi)" TMPDIR="${TMPDIR:-/tmp}" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            sdc/sdcd/target/release/sdcd --port 7811 --database "$RUNNER_TEMP/e2e.db" > out/daemon.log 2>&1 &
          for i in $(seq 1 30); do nc -z 127.0.0.1 7811 && break; sleep 1; done
          SDC_E2E_TURNS=1 SDC_E2E_SSH="sdce2e@127.0.0.1" SDC_E2E_PASS="$E2E_PASS" node .github/probe/e2e-os.mjs 7811 2>&1 | tee out/e2e.txt || true
      - name: End to end (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Start-Process sdc/sdcd/target/release/sdcd.exe -ArgumentList "--port","7811","--database","$env:RUNNER_TEMP\e2e.db" -WindowStyle Hidden
          Start-Sleep 4
          $env:SDC_E2E_TURNS = "1"
          node .github/probe/e2e-os.mjs 7811 2>&1 | Tee-Object out/e2e.txt
          exit 0

      - name: The app starts its own daemon (Linux .deb under a virtual display)
        if: runner.os == 'Linux'
        run: |
          set +e
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb >/dev/null
          pkill -x sdcd || true
          (cd sdc && pnpm install --frozen-lockfile && cd app && pnpm tauri build --bundles deb) > out/app-build.log 2>&1
          echo "build exit $?" >> out/app-build.log
          sudo apt-get install -y ./sdc/app/src-tauri/target/release/bundle/deb/*.deb >> out/app-build.log 2>&1
          (xvfb-run -a sdc > out/app.log 2>&1 &) ; for i in $(seq 1 40); do nc -z 127.0.0.1 7811 && break; sleep 1; done
          { nc -z 127.0.0.1 7811 && echo "PASS  linux app started its daemon" || echo "FAIL  linux app did not start its daemon"; pgrep -a sdcd; } | tee -a out/e2e.txt
          sleep 5; DISPLAY= xvfb-run -a true; import -window root out/screen.png 2>/dev/null || true

      - name: Push the results
        if: always()
        shell: bash
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout --orphan "probe-results-${{ matrix.name }}"
          git rm -rq --cached . || true
          git add -f out
          git commit -qm "os probe ${{ matrix.name }} $(date -u +%FT%TZ)"
          git push -qf origin "probe-results-${{ matrix.name }}"

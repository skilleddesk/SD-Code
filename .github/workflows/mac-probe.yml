name: mac-probe

# Dev-only. Round 2: a Mac as a user has it - zsh, the CLIs on a PATH only ~/.zshrc sets, and an app opened
# with launchd's bare PATH (/usr/bin:/bin:/usr/sbin:/sbin). Results go to the `probe-results` branch.
on:
  push:
    branches: [mac-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CLIs in ~/.npm-global, reachable only through ~/.zshrc
        run: |
          nodebin=$(dirname "$(which node)")
          npm config set prefix "$HOME/.npm-global"
          npm i -g @anthropic-ai/claude-code @openai/codex >/dev/null
          echo "export PATH=\"$nodebin:\$HOME/.npm-global/bin:\$PATH\"" >> ~/.zshrc
          ls ~/.npm-global/bin
      - name: Install SDC like a user
        run: |
          tag=$(cat .github/probe/TAG)
          curl -sSL -o sdc.dmg "https://github.com/${{ github.repository }}/releases/download/$tag/SDC_${tag#v}_aarch64.dmg"
          hdiutil attach sdc.dmg -nobrowse -mountpoint /Volumes/SDC
          cp -R /Volumes/SDC/SDC.app /Applications/
          hdiutil detach /Volumes/SDC
      - name: Open it with launchd's bare PATH, then probe
        run: |
          mkdir -p out
          launchctl setenv PATH /usr/bin:/bin:/usr/sbin:/sbin
          launchctl setenv SHELL /bin/zsh
          open -a /Applications/SDC.app
          for i in $(seq 1 60); do lsof -nP -iTCP:7811 -sTCP:LISTEN >/dev/null && break; sleep 1; done
          sleep 8
          app=$(pgrep -x sdc || true); pid=$(pgrep -x sdcd || true)
          { echo "app $app"; ps eww $app | tr ' ' '\n' | grep -E '^(PATH|SHELL)='; echo "sdcd $pid"; ps eww $pid | tr ' ' '\n' | grep -E '^(PATH|SHELL)='; } | tee out/env.txt
          node .github/probe/probe.mjs 2>&1 | tee out/probe.txt
          screencapture -x out/screen.png || true
      - name: Can the window be driven through accessibility?
        run: |
          osascript -e 'tell application "SDC" to activate' || true
          sleep 2
          osascript -e 'tell application "System Events" to tell process "SDC" to get entire contents of window 1' > out/ax.txt 2>&1 || true
          head -c 4000 out/ax.txt
          screencapture -x out/screen2.png || true
      - name: Push the results
        if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-results
          git rm -rq --cached . || true
          git add -f out
          git commit -qm "mac probe 2 $(date -u +%FT%TZ)"
          git push -qf origin probe-results

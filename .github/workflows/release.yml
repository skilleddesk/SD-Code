name: release

# Every platform's installer, built on its own runner and attached to one GitHub Release.
#
# The reason this lives in CI rather than in a script someone runs by hand: **no host can build
# another platform's bundle.** A Windows `.msi` needs WiX, a `.dmg` needs macOS and `codesign`, an
# `AppImage` needs the Linux GTK/WebKit libraries - so "click to install on all three" is a property
# of this workflow, not of a machine.
#
# Tag `v0.4.2` (or run it from the Actions tab) and the release is published with:
#   SDC_<version>_x64-setup.exe      Windows installer (NSIS)
#   SDC_<version>_x64_en-US.msi      Windows installer (WiX)
#   SDC_<version>_x64.dmg            macOS, Intel
#   SDC_<version>_aarch64.dmg        macOS, Apple Silicon
#   SDC_<version>_amd64.AppImage     Linux, portable
#   SDC_<version>_amd64.deb          Linux, Debian/Ubuntu
#   SDC-<version>-1.x86_64.rpm       Linux, Fedora/openSUSE (0.21.1)
#
# The daemon is bundled into every one of them: `beforeBuildCommand` runs `pnpm daemon:package`
# first, which builds `sdcd` and copies it under the target triple Tauri's `externalBin` expects.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The release has to be created and its assets uploaded, which needs write access to contents.
permissions:
  contents: write
  # 0.22: every installer gets a signed build-provenance attestation (Sigstore, keyless, free): proof that it
  # was built by this workflow from this commit, checkable with `gh attestation verify <file> --repo <repo>`.
  id-token: write
  attestations: write

jobs:
  # ------------------------------------------------------------------------------------------------
  # One version on every platform, or none (0.15.8).
  #
  # Until 0.15.7 each platform's job published its own files to a public release as soon as it
  # finished, and the Windows job then deleted every older release. A macOS job that failed therefore
  # left a public release with no `.dmg` - and had already cost Mac users the previous one too. Now:
  #
  #   prepare   creates the release as a DRAFT (invisible to the app's update check and to visitors);
  #   build     every platform uploads into that draft;
  #   publish   runs only when all four builds succeeded, checks every installer is there, makes the
  #             release public and only then removes the older ones.
  #
  # A failed platform leaves the previous release public and untouched for everyone.
  # ------------------------------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # A re-run reuses the draft (or release) this tag already has.
          id=$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)

          if [ -z "$id" ]; then
            body=$(cat <<'BODY'
          SDC - a local-first coding-agent workbench: a Tauri 2 desktop app, the `sdcd` host daemon and an append-only event log. Every platform below is the same version, built from the same commit.

          | Platform | File | Notes |
          | --- | --- | --- |
          | Windows | `*_x64-setup.exe` | Double-click, Next, Install. |
          | Windows | `*_x64_en-US.msi` | The same, for managed installs. |
          | macOS | `*_x64.dmg` / `*_aarch64.dmg` | Intel and Apple Silicon. |
          | Linux | `*.deb` | Ubuntu / Debian: double-click it, then **Install** in the Software window. |
          | Linux | `*.rpm` | Fedora / openSUSE: double-click it, then **Install** in the Software window. |
          | Linux | `*.AppImage` | Other distributions: right-click → Properties → Permissions → **Allow executing as program**, then double-click. (On Ubuntu and Debian use the `.deb` instead.) |

          The installers are unsigned, so Windows SmartScreen and macOS Gatekeeper will both ask once: Windows needs **More info → Run anyway**, macOS needs System Settings → Privacy & Security → **Open Anyway**.

          Everything else is inside the app - no terminal on any platform: the daemon is bundled and starts itself, and Node.js, the Claude Code / Codex / Gemini CLIs, Ollama (and its models), ripgrep and Git are installed from the app with one click (Settings → Environment, or a provider's Connect card), into SDC's own folder and without administrator rights.
          BODY
            )
            id=$(gh api -X POST "repos/$REPO/releases" -f tag_name="$TAG" -f name="SDC $TAG" -f body="$body" -F draft=true -F prerelease=false --jq .id)
          fi

          echo "release $id for $TAG"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ''
            label: linux-x64
          - platform: windows-latest
            target: ''
            label: windows-x64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdc/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # A macOS job needs its own architecture's standard library, and the Intel job is the only
          # one that asks for a target at all - it cross-compiles from an Apple Silicon runner.
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            sdc/sdcd
            sdc/app/src-tauri

      # WebKitGTK and the rest of what a Tauri window links against on Linux. On the other two
      # platforms the equivalents ship with the OS image.
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install the workspace
        working-directory: sdc
        run: pnpm install --frozen-lockfile

      - name: Checks (typecheck)
        working-directory: sdc
        run: pnpm typecheck

      - name: Checks (lint)
        working-directory: sdc
        run: pnpm lint

      - name: Checks (vitest)
        working-directory: sdc
        run: pnpm test

      # The schema, `types.ts` and the daemon's dispatch table, compared (0.7.10). `protocol/sdcp.schema.json`
      # had never been parsed by anything, which is how it held invalid JSON (`["string"]?`) and nine methods
      # with no `params`/`result` shape without anyone noticing.
      - name: Checks (protocol)
        working-directory: sdc
        run: node protocol/check.mjs

      - name: Checks (cargo test)
        working-directory: sdc
        # The suite takes about two minutes everywhere. 0.9.0's first Windows run hung here for four
        # hours with no log to read (a running job has none); a bounded step fails fast and keeps one.
        timeout-minutes: 20
        # `bash` on every platform, because the failure summary below is built with a pipe and a status array.
        shell: bash
        run: |
          set +e
          cargo test --manifest-path sdcd/Cargo.toml 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            # A job's **annotations** are the one part of a failing run that can be read from the API without
            # being the repository's owner, and the log is not. So the reason travels there: the first real
            # compiler errors, or the names and panic lines of the tests that failed.
            {
              grep -E '^error(\[|:)' cargo-test.log | head -8
              grep -A 2 -E 'panicked at' cargo-test.log | head -12
              grep -E '^(test .* FAILED|assertion)' cargo-test.log | head -8
              grep -E 'test result: FAILED' cargo-test.log | head -2
            } | sort -u | while IFS= read -r line; do
              echo "::error title=cargo test::$line"
            done

            exit "$status"
          fi

      - name: The built window renders
        working-directory: sdc
        # A bundle that compiles is not a bundle that mounts. 0.4.1-0.4.3 passed every check above and
        # still opened a window with nothing in it (a store selector that returned a new array made
        # React loop until it unmounted the tree), so the release now opens the built frontend in the
        # runner's browser before an installer is allowed to carry it. See
        # `app/scripts/smoke-bundle.mjs` and the 0.4.4 section of CHANGELOG.md.
        #
        # The same built frontend is then audited by axe-core (`app/scripts/a11y-bundle.mjs`), which 0.7.10
        # wired in: it found an `aria-selected` on six plain buttons (critical), white-on-accent text at
        # 2.3-2.7:1 (serious) and a muted label at 3.27:1 (serious) on the very first run.
        run: |
          pnpm build
          pnpm --filter @sdc/app smoke
          pnpm --filter @sdc/app smoke:a11y

      - name: Build and upload into the draft
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `pnpm daemon:package` reads this, so both macOS slices build the daemon for the
          # architecture they are producing - including the Intel `.dmg`, which is cross-built on an
          # Apple Silicon runner because an Intel runner can queue for a very long time.
          SDC_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          projectPath: sdc/app
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      # 0.22: signed provenance for every installer this runner built - who built it, from which commit, with
      # which workflow - recorded in GitHub's attestation store and Sigstore's public log. It does not replace
      # Windows Authenticode or Apple notarisation (those need a paid identity); it proves the file is ours.
      - name: Attest where these installers came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), ',') }}

  # Only after EVERY platform built (a `needs` job does not run when one of them failed).
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Every installer is in the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          names=$(gh api "repos/$REPO/releases/$ID/assets?per_page=100" --jq '.[].name')
          echo "$names"
          missing=0

          for pattern in '_x64-setup\.exe$' '_x64_en-US\.msi$' '_x64\.dmg$' '_aarch64\.dmg$' '\.AppImage$' '\.deb$' '\.rpm$'; do
            if ! echo "$names" | grep -Eq "$pattern"; then
              echo "::error title=release incomplete::no asset matches $pattern - the release stays a draft"
              missing=1
            fi
          done

          exit "$missing"

      - name: Make it public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.prepare.outputs.release_id }}
        run: gh api -X PATCH "repos/$REPO/releases/$ID" -F draft=false -f make_latest=true --jq '.html_url'

      # 0.22: one checksum file for every installer, so a download can be checked by anyone, on any system.
      # After "Make it public": a draft release cannot be found by its tag.
      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p sums && cd sums
          gh release download "$TAG" --repo "$REPO" --pattern 'SDC*'
          sha256sum SDC* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber

      # ----------------------------------------------------------------------------------------------
      # One version, and only one - and only once the new one is public on every platform.
      #
      # The Releases page used to grow (0.4.1-0.4.3 did not render at all and stayed downloadable). So
      # the published tag is the only release that survives. The release goes, the tag stays:
      # `--cleanup-tag` once deleted v0.7.9-v0.7.11. `continue-on-error`: pruning is housekeeping.
      # ----------------------------------------------------------------------------------------------
      - name: Keep only this release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ github.ref_name }}
        run: |
          echo "keeping $CURRENT"

          for tag in $(gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$tag" = "$CURRENT" ]; then continue; fi

            echo "deleting release $tag"
            gh release delete "$tag" --repo "$REPO" --yes
          done

          gh release list --repo "$REPO" --limit 100
